<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>个人 Agent 工作台</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-soft: #eef2ff; --warn: #d97706; --ok: #0f766e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: #fff; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 15px; }
  .tabs { display: flex; gap: 4px; }
  .tab { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; font: inherit; font-size: 14px; }
  .tab.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .pane { flex: 1; min-height: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .grow { flex: 1; }

  /* ---------- 对话面板 ---------- */
  #pane-chat { display: flex; flex-direction: column; }
  .chat-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 18px; border-bottom: 1px solid var(--line); background: #fff; }
  .chat-bar select { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); max-width: 260px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .ghost { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .welcome { margin: auto; max-width: 560px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.9; }
  .welcome b { color: var(--text); }
  .msg { display: flex; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg.user { flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 15px; background: #e9edf3; }
  .msg.user .avatar { background: var(--accent); color: #fff; }
  .bubble { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; max-width: calc(100% - 48px); overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--accent); border-color: var(--accent); color: #fff; white-space: pre-wrap; }
  .msg.assistant .bubble { box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .bubble img { max-width: 260px; max-height: 200px; border-radius: 8px; display: block; margin: 6px 0; border: 1px solid rgba(0,0,0,.08); }
  .bubble .meta { margin-top: 8px; color: var(--muted); font-size: 11px; border-top: 1px dashed var(--line); padding-top: 6px; }
  .msg.user .bubble .meta { color: rgba(255,255,255,.75); border-top-color: rgba(255,255,255,.25); }
  .bubble p { margin: 6px 0; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 10px 0 6px; line-height: 1.35; }
  .bubble h1 { font-size: 18px; } .bubble h2 { font-size: 16px; } .bubble h3 { font-size: 15px; }
  .bubble ul { margin: 6px 0; padding-left: 20px; }
  .bubble pre { background: #0f172a; color: #e5e7eb; padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
  .bubble code { background: #f1f3f5; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bubble pre code { background: transparent; padding: 0; }
  .bubble a { color: var(--accent); }
  .msg.user .bubble a { color: #fff; text-decoration: underline; }
  .bubble.error { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }
  .composer { border-top: 1px solid var(--line); background: #fff; padding: 10px 18px 12px; }
  .pending { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .pending:empty { display: none; }
  .chip-file { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fafbfc; border-radius: 8px; padding: 4px 8px; font-size: 12px; color: var(--muted); }
  .chip-file img { width: 34px; height: 34px; object-fit: cover; border-radius: 5px; }
  .chip-file button { border: 0; background: transparent; cursor: pointer; color: #b91c1c; font-size: 14px; padding: 0 2px; }
  .input-row { display: flex; align-items: flex-end; gap: 8px; }
  #input { flex: 1; resize: none; max-height: 180px; min-height: 40px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 14px; line-height: 1.5; background: #fafbfc; }
  #input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .icon { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; font-size: 16px; }
  .primary { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 10px; padding: 0 18px; height: 38px; font: inherit; font-size: 14px; cursor: pointer; }
  .primary:disabled { opacity: .5; cursor: default; }
  .hint { margin-top: 6px; color: #9ca3af; font-size: 12px; }

  /* ---------- 截图取字面板 ---------- */
  #pane-ocr { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 16px; padding: 14px 22px 24px; align-items: start; overflow-y: auto; }
  @media (max-width: 860px) { #pane-ocr { grid-template-columns: 1fr; } }
  .card { background: var(--card); border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05); padding: 14px; margin: 0; }
  #drop { border: 2px dashed #cbd5e1; border-radius: 10px; min-height: 180px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); cursor: pointer; transition: .15s; padding: 16px; }
  #drop.hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  #drop.has-img { border-style: solid; border-color: transparent; padding: 0; }
  #imgwrap { position: relative; display: inline-block; max-width: 100%; }
  #imgwrap img { max-width: 100%; display: block; border-radius: 8px; }
  .hl { position: absolute; border: 2px solid var(--accent); background: rgba(37,99,235,.14); border-radius: 3px; pointer-events: none; display: none; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .toolbar button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--text); cursor: pointer; }
  .toolbar button:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg-btn { border: 0 !important; border-radius: 0 !important; padding: 6px 12px; background: #fff; color: var(--muted); }
  .seg-btn.on { background: var(--accent); color: #fff; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .lines { display: flex; flex-direction: column; gap: 6px; }
  .line { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; cursor: copy; transition: .12s; }
  .line:hover { border-color: var(--accent); background: var(--accent-soft); }
  .line .orig { white-space: pre-wrap; word-break: break-word; }
  .line .zh { margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--line); color: var(--ok); white-space: pre-wrap; word-break: break-word; }
  .line.low { border-left: 3px solid var(--warn); }
  .line.low .conf { color: var(--warn); }
  .conf { float: right; font-size: 11px; color: #9ca3af; margin-left: 8px; }
  .empty { color: var(--muted); padding: 24px 8px; text-align: center; }
  .err { color: #b91c1c; background: #fef2f2; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-top: 10px; }
  #toast { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px); background: #111827; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; z-index: 10; }
  #toast.on { opacity: .95; transform: translateX(-50%) translateY(0); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #cbd5e1; border-top-color: var(--accent); border-radius: 50%; animation: r .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="brand">个人 Agent 工作台</div>
  <div class="tabs">
    <button class="tab on" data-pane="chat">对话</button>
    <button class="tab" data-pane="ocr">截图取字</button>
  </div>
</header>

<!-- ---------- 对话 ---------- -->
<main id="pane-chat" class="pane">
  <div class="chat-bar">
    <select id="modelSel" title="模型"></select>
    <select id="thinkSel" title="思考强度（部分平台只区分开关）">
      <option value="off">思考：关</option>
      <option value="low">思考：低</option>
      <option value="medium">思考：中</option>
      <option value="high">思考：高</option>
    </select>
    <label class="toggle" title="聊天 API 无状态：历史图片每轮都会重新计费。开启后旧图替换成文字占位"><input type="checkbox" id="elide" checked /> 图片仅最近一轮</label>
    <div class="grow"></div>
    <button id="clearChat" class="ghost">清空对话</button>
  </div>
  <section id="msgs" class="msgs">
    <div class="welcome">
      <b>个人 Agent 工作台</b><br />
      可以直接聊天；也可以贴图/上传附件后提问（图片需选「视觉」模型）。<br />
      Enter 发送 · Shift+Enter 换行 · Ctrl+V 粘贴截图
    </div>
  </section>
  <footer class="composer">
    <div id="pending" class="pending"></div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="imgBtn" class="icon" title="上传图片">🖼</button>
      <button id="fileBtn" class="icon" title="上传文本附件">📎</button>
      <button id="micBtn" class="icon" title="语音输入（下一版接入）">🎤</button>
      <button id="sendBtn" class="primary">发送</button>
    </div>
    <input type="file" id="imgFile" accept="image/*" multiple hidden />
    <input type="file" id="docFile" accept=".txt,.md,.json,.csv,.log,.ts,.js,.py,.html,.css,.yaml,.yml" multiple hidden />
    <div class="hint">图片发送给视觉模型；文本附件读入正文（单文件 ≤100KB）。语音输入下一版接入。</div>
  </footer>
</main>

<!-- ---------- 截图取字 ---------- -->
<main id="pane-ocr" class="pane" style="display:none">
  <section class="card">
    <div id="drop" tabindex="0">粘贴 / 拖入 / 点击选择截图</div>
    <input type="file" id="file" accept="image/*" hidden />
    <div class="toolbar">
      <div class="seg" role="group" aria-label="识别引擎">
        <button class="seg-btn on" data-engine="local" title="本地 tesseract：免费离线、带坐标、可悬停定位">本地</button>
        <button class="seg-btn" data-engine="ai" title="视觉 LLM：版式理解强，但无坐标、按图计费">AI 识别</button>
      </div>
      <label class="toggle"><input type="checkbox" id="translate" checked /> 翻译成中文</label>
      <button id="copyAll" disabled>复制全文</button>
      <button id="clear" disabled>清空</button>
    </div>
    <div class="meta" id="meta"></div>
    <div id="err" class="err" style="display:none"></div>
  </section>
  <section class="card">
    <div id="result" class="empty">识别结果会出现在这里</div>
  </section>
</main>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id)
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on')
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1600)
}
// 剪贴板：https/localhost 有 navigator.clipboard；http://局域网IP 不是 secure context → execCommand 兜底
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true }
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok
  } catch { return false }
}

// ---------- 标签页 ----------
let activePane = 'chat'
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
  activePane = b.dataset.pane
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b))
  $('pane-chat').style.display = activePane === 'chat' ? 'flex' : 'none'
  $('pane-ocr').style.display = activePane === 'ocr' ? 'grid' : 'none'
}))

// ============================================================
// 对话
// ============================================================
const msgsEl = $('msgs'), inputEl = $('input'), pendingEl = $('pending')
const modelSel = $('modelSel'), thinkSel = $('thinkSel'), elideChk = $('elide')
let messages = []       // {role, content: string | parts[]}
let pending = []        // {type:'image', name, dataUrl} | {type:'text', name, text}
let streaming = false

// 模型目录来自 /api/models（llm.ts 四档生成）
fetch('/api/models').then((r) => r.json()).then((j) => {
  modelSel.innerHTML = ''
  for (const m of j.models) {
    const o = document.createElement('option')
    o.value = m.id
    o.textContent = `${m.label} · ${m.model}${m.vision ? ' · 视觉' : ''}`
    if (m.id === j.defaultModelId) o.selected = true
    modelSel.appendChild(o)
  }
}).catch(() => toast('模型目录加载失败'))

// ---------- 轻量 markdown（先整体转义，再插入白名单标签——XSS 安全） ----------
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const inline = (s) => s
  .replace(/`([^`\n]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
  .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
function md(src) {
  const lines = esc(src).split('\n')
  let out = '', inCode = false, inList = false
  for (const line of lines) {
    if (line.startsWith('```')) {
      if (inCode) { out += '</code></pre>'; inCode = false } else { if (inList) { out += '</ul>'; inList = false } out += '<pre><code>' }
      continue
    }
    if (inCode) { out += line + '\n'; continue }
    const h = /^(#{1,3}) (.+)$/.exec(line)
    if (h) { if (inList) { out += '</ul>'; inList = false } out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue }
    if (/^[-*] /.test(line)) { if (!inList) { out += '<ul>'; inList = true } out += `<li>${inline(line.slice(2))}</li>`; continue }
    if (inList) { out += '</ul>'; inList = false }
    if (!line.trim()) { out += '<div style="height:6px"></div>'; continue }
    out += `<p>${inline(line)}</p>`
  }
  if (inCode) out += '</code></pre>'
  if (inList) out += '</ul>'
  return out
}

function fmtUsage(u) {
  if (!u) return ''
  const parts = []
  if (u.prompt_tokens != null) parts.push(`prompt ${u.prompt_tokens}`)
  if (u.completion_tokens != null) parts.push(`completion ${u.completion_tokens}`)
  if (u.total_tokens != null) parts.push(`total ${u.total_tokens}`)
  const cached = u.prompt_tokens_details?.cached_tokens
  if (cached != null) parts.push(`缓存命中 ${cached}`)
  const reasoning = u.completion_tokens_details?.reasoning_tokens
  if (reasoning != null) parts.push(`推理 ${reasoning}`)
  return parts.join(' · ')
}

function bubbleFor(role, { error = false } = {}) {
  const wrap = document.createElement('div')
  wrap.className = `msg ${role}`
  const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = role === 'user' ? '我' : 'AI'
  const bubble = document.createElement('div'); bubble.className = 'bubble' + (error ? ' error' : '')
  wrap.appendChild(avatar); wrap.appendChild(bubble)
  msgsEl.appendChild(wrap)
  msgsEl.scrollTop = msgsEl.scrollHeight
  return bubble
}

function renderUser(bubble, content) {
  bubble.innerHTML = ''
  const parts = typeof content === 'string' ? [{ type: 'text', text: content }] : content
  for (const p of parts) {
    if (p.type === 'text') {
      const d = document.createElement('div'); d.style.whiteSpace = 'pre-wrap'; d.textContent = p.text; bubble.appendChild(d)
    } else if (p.type === 'image') {
      const img = document.createElement('img'); img.src = p.dataUrl; img.alt = p.name || '图片'; bubble.appendChild(img)
    }
  }
}

function renderAssistant(bubble, msg) {
  bubble.innerHTML = md(msg.content || '')
  const meta = document.createElement('div'); meta.className = 'meta'
  const bits = [msg.model ?? '', fmtUsage(msg.usage), msg.elapsedMs != null ? `${(msg.elapsedMs / 1000).toFixed(1)}s` : ''].filter(Boolean)
  meta.textContent = bits.join(' · ')
  if (bits.length) bubble.appendChild(meta)
}

// ---------- 附件 ----------
function addImageFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue
    const r = new FileReader()
    r.onload = () => { pending.push({ type: 'image', name: f.name || '粘贴的图片', dataUrl: r.result }); renderPending() }
    r.readAsDataURL(f)
  }
}
function addDocFiles(files) {
  for (const f of files) {
    if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) { toast('PDF 暂不支持，先转成图片或文本'); continue }
    if (f.size > 100 * 1024) { toast(`「${f.name}」超过 100KB，先拆分`); continue }
    const r = new FileReader()
    r.onload = () => { pending.push({ type: 'text', name: f.name, text: r.result }); renderPending() }
    r.readAsText(f)
  }
}
function renderPending() {
  pendingEl.innerHTML = ''
  pending.forEach((p, i) => {
    const chip = document.createElement('span'); chip.className = 'chip-file'
    if (p.type === 'image') { const im = document.createElement('img'); im.src = p.dataUrl; chip.appendChild(im) }
    const label = document.createElement('span')
    label.textContent = p.name + (p.type === 'text' ? ` · ${Math.ceil(p.text.length / 1000)}k 字` : '')
    chip.appendChild(label)
    const x = document.createElement('button'); x.textContent = '✕'; x.title = '移除'
    x.addEventListener('click', () => { pending.splice(i, 1); renderPending() })
    chip.appendChild(x)
    pendingEl.appendChild(chip)
  })
}
$('imgBtn').addEventListener('click', () => $('imgFile').click())
$('fileBtn').addEventListener('click', () => $('docFile').click())
$('imgFile').addEventListener('change', () => { addImageFiles($('imgFile').files); $('imgFile').value = '' })
$('docFile').addEventListener('change', () => { addDocFiles($('docFile').files); $('docFile').value = '' })
$('micBtn').addEventListener('click', () => toast('语音输入下一版接入'))

// 粘贴：对话面板 → 附件；截图面板 → 走 OCR（见下）
document.addEventListener('paste', (e) => {
  if (activePane !== 'chat') return
  const imgs = [...(e.clipboardData?.items || [])].filter((i) => i.type.startsWith('image/')).map((i) => i.getAsFile()).filter(Boolean)
  if (imgs.length) { e.preventDefault(); addImageFiles(imgs); toast(`已添加 ${imgs.length} 张图片`) }
})

// Enter 发送 / Shift+Enter 换行；textarea 自适应高度
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat() }
})
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto'
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px'
})

function readSSEChunk(buf) {
  // 返回 [事件数组, 剩余缓冲]
  const events = []
  let idx
  while ((idx = buf.indexOf('\n\n')) >= 0) {
    const raw = buf.slice(0, idx); buf = buf.slice(idx + 2)
    const line = raw.split('\n').find((l) => l.startsWith('data: '))
    if (!line) continue
    try { events.push(JSON.parse(line.slice(6))) } catch {}
  }
  return [events, buf]
}

async function sendChat() {
  if (streaming) return
  const text = inputEl.value.trim()
  if (!text && pending.length === 0) return
  const parts = []
  if (text) parts.push({ type: 'text', text })
  for (const p of pending) {
    if (p.type === 'image') parts.push({ type: 'image', dataUrl: p.dataUrl, name: p.name })
    else parts.push({ type: 'text', text: `附件 ${p.name}：\n\`\`\`\n${p.text}\n\`\`\`` })
  }
  // 纯文本保持字符串形状（history 体积小、归一函数走快路径）；带附件/图片才用 parts 数组
  const userMsg = { role: 'user', content: parts.length === 1 && parts[0].type === 'text' ? text : parts }
  messages.push(userMsg)
  renderUser(bubbleFor('user'), userMsg.content)
  inputEl.value = ''; inputEl.style.height = 'auto'; pending = []; renderPending()
  const welcome = msgsEl.querySelector('.welcome'); if (welcome) welcome.remove()

  streaming = true; $('sendBtn').disabled = true
  const assistant = { role: 'assistant', content: '' }
  const bubble = bubbleFor('assistant')
  bubble.innerHTML = '<span class="spin"></span>思考中…'
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, modelId: modelSel.value, thinking: thinkSel.value, imageElision: elideChk.checked }),
    })
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || `HTTP ${res.status}`) }
    const reader = res.body.getReader(); const dec = new TextDecoder()
    let buf = '', acc = ''
    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buf += dec.decode(value, { stream: true })
      let events
      ;[events, buf] = readSSEChunk(buf)
      for (const ev of events) {
        if (ev.type === 'delta') { acc += ev.text; bubble.textContent = acc }
        else if (ev.type === 'done') { assistant.content = ev.text || acc; assistant.usage = ev.usage; assistant.elapsedMs = ev.elapsedMs; assistant.model = ev.model }
        else if (ev.type === 'error') throw new Error(ev.error)
      }
    }
    if (!assistant.content) throw new Error('模型没有返回内容')
    messages.push(assistant)
    renderAssistant(bubble, assistant)
  } catch (e) {
    bubble.className = 'bubble error'
    bubble.textContent = '发送失败：' + e.message
  } finally {
    streaming = false; $('sendBtn').disabled = false; inputEl.focus()
    msgsEl.scrollTop = msgsEl.scrollHeight
  }
}
$('sendBtn').addEventListener('click', sendChat)
$('clearChat').addEventListener('click', () => {
  if (streaming) return toast('等当前回答结束')
  messages = []; pending = []; renderPending(); msgsEl.innerHTML = '<div class="welcome"><b>个人 Agent 工作台</b><br />可以直接聊天；也可以贴图/上传附件后提问（图片需选「视觉」模型）。<br />Enter 发送 · Shift+Enter 换行 · Ctrl+V 粘贴截图</div>'
})

// ============================================================
// 截图取字（原逻辑保留）
// ============================================================
const drop = $('drop'), fileInput = $('file'), result = $('result'), meta = $('meta')
const errBox = $('err'), copyAllBtn = $('copyAll'), clearBtn = $('clear'), translateChk = $('translate')
let currentLines = []
let engine = localStorage.getItem('pa.engine') === 'ai' ? 'ai' : 'local'

function setEngine(e) {
  engine = e === 'ai' ? 'ai' : 'local'
  localStorage.setItem('pa.engine', engine)
  document.querySelectorAll('.seg-btn').forEach((b) => b.classList.toggle('on', b.dataset.engine === engine))
}
document.querySelectorAll('.seg-btn').forEach((b) => b.addEventListener('click', () => setEngine(b.dataset.engine)))
setEngine(engine)

function showError(msg) { errBox.textContent = msg; errBox.style.display = 'block' }
function clearError() { errBox.style.display = 'none' }

async function handleImage(dataUrl) {
  clearError()
  drop.classList.add('has-img')
  drop.innerHTML = `<div id="imgwrap"><img id="preview" src="${dataUrl}" alt="截图预览"><div class="hl" id="hl"></div></div>`
  result.className = 'empty'; result.innerHTML = '<span class="spin"></span>识别中…'
  meta.textContent = ''
  copyAllBtn.disabled = clearBtn.disabled = true
  const t0 = performance.now()
  try {
    const res = await fetch('/api/ocr' + (translateChk.checked ? '' : '?translate=0'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl, engine }),
    })
    const j = await res.json()
    if (!res.ok) throw new Error((j.error || ('HTTP ' + res.status)) + (res.status === 502 ? ' ——可切到「本地」引擎重试' : ''))
    render(j, (performance.now() - t0) / 1000)
  } catch (e) {
    result.className = 'empty'; result.textContent = '识别失败：' + e.message
  }
}

function render(j, secs) {
  currentLines = j.lines || []
  const zh = new Map((j.translations || []).map((t) => [t.id, t.zh]))
  const tag = j.engine === 'ai' ? 'AI 识别' : '本地 OCR'
  const usageBits = [fmtUsage(j.usage), fmtUsage(j.translateUsage)].filter(Boolean)
  meta.textContent = `${tag} · ${currentLines.length} 行` + (typeof j.confidence === 'number' ? ` · 置信 ${Math.round(j.confidence)}%` : '') + ` · OCR ${j.elapsedMs}ms · 共 ${secs.toFixed(1)}s` + (usageBits.length ? ` · ${usageBits.join(' · 翻译 ')}` : '') + (j.translateError ? ' · 翻译失败（只显示原文）' : '')
  if (j.translateError) showError('翻译服务失败：' + j.translateError + '——OCR 结果不受影响')
  copyAllBtn.disabled = clearBtn.disabled = currentLines.length === 0
  if (currentLines.length === 0) { result.className = 'empty'; result.textContent = '没识别到文字——试试更清晰/更大字号的截图'; return }
  result.className = 'lines'; result.innerHTML = ''
  for (const l of currentLines) {
    const div = document.createElement('div')
    const lowConf = typeof l.confidence === 'number' && l.confidence < 60
    div.className = 'line' + (lowConf ? ' low' : '')
    div.dataset.id = l.id
    if (typeof l.confidence === 'number') div.innerHTML = `<span class="conf">${Math.round(l.confidence)}%</span>`
    const orig = document.createElement('div'); orig.className = 'orig'; orig.textContent = l.text
    div.appendChild(orig)
    if (zh.has(l.id)) {
      const z = document.createElement('div'); z.className = 'zh'; z.textContent = zh.get(l.id)
      z.title = '点击复制译文'
      z.addEventListener('click', async (e) => { e.stopPropagation(); toast(await copyText(z.textContent) ? '已复制译文' : '复制失败') })
      div.appendChild(z)
    }
    div.addEventListener('click', async () => toast(await copyText(l.text) ? '已复制这一行' : '复制失败'))
    if (l.bbox) {
      div.addEventListener('mouseenter', () => highlight(l.bbox))
      div.addEventListener('mouseleave', () => { const hl = $('hl'); if (hl) hl.style.display = 'none' })
    }
    result.appendChild(div)
  }
}

function highlight(bbox) {
  const img = $('preview'), hl = $('hl')
  if (!img || !hl || !bbox) return
  const sx = img.clientWidth / img.naturalWidth, sy = img.clientHeight / img.naturalHeight
  hl.style.left = bbox.x0 * sx + 'px'; hl.style.top = bbox.y0 * sy + 'px'
  hl.style.width = (bbox.x1 - bbox.x0) * sx + 'px'; hl.style.height = (bbox.y1 - bbox.y0) * sy + 'px'
  hl.style.display = 'block'
}

// 截图面板里的粘贴/拖放/选择
document.addEventListener('paste', (e) => {
  if (activePane !== 'ocr') return
  for (const item of e.clipboardData?.items || []) {
    if (item.type.startsWith('image/')) {
      const f = item.getAsFile(); const r = new FileReader(); r.onload = () => handleImage(r.result); r.readAsDataURL(f)
      e.preventDefault(); return
    }
  }
})
drop.addEventListener('click', () => fileInput.click())
drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') fileInput.click() })
fileInput.addEventListener('change', () => {
  const f = fileInput.files?.[0]; fileInput.value = ''
  if (!f) return
  const r = new FileReader(); r.onload = () => handleImage(r.result); r.readAsDataURL(f)
})
for (const evt of ['dragenter', 'dragover']) drop.addEventListener(evt, (e) => { e.preventDefault(); drop.classList.add('hover') })
for (const evt of ['dragleave', 'drop']) drop.addEventListener(evt, (e) => { e.preventDefault(); drop.classList.remove('hover') })
drop.addEventListener('drop', (e) => {
  const f = [...(e.dataTransfer?.files || [])].find((f) => f.type.startsWith('image/'))
  if (!f) return
  const r = new FileReader(); r.onload = () => handleImage(r.result); r.readAsDataURL(f)
})

copyAllBtn.addEventListener('click', async () => {
  const text = currentLines.map((l) => l.text).join('\n')
  toast(await copyText(text) ? `已复制全文（${currentLines.length} 行）` : '复制失败')
})
clearBtn.addEventListener('click', () => {
  currentLines = []
  drop.classList.remove('has-img'); drop.textContent = '粘贴 / 拖入 / 点击选择截图'
  result.className = 'empty'; result.textContent = '识别结果会出现在这里'
  meta.textContent = ''; clearError(); copyAllBtn.disabled = clearBtn.disabled = true
})
</script>
</body>
